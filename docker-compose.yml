x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3 requests pyarrow pandas psycopg2-binary apache-airflow-providers-apache-spark apache-airflow-providers-postgres"
    AIRFLOW_VAR_OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    AIRFLOW_VAR_MINIO_ENDPOINT: minio:9000
    AIRFLOW_VAR_MINIO_ACCESS_KEY: minioadmin
    AIRFLOW_VAR_MINIO_SECRET_KEY: minioadmin
    AIRFLOW_VAR_POSTGRES_HOST: postgres
    AIRFLOW_VAR_POSTGRES_DB: nyc_pipeline
    AIRFLOW_VAR_POSTGRES_USER: pipeline
    AIRFLOW_VAR_POSTGRES_PASSWORD: pipeline
    PYTHONPATH: /opt/airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./ingestion:/opt/airflow/ingestion
    - ./spark:/opt/airflow/spark
    - ./streaming:/opt/airflow/streaming
    - ./config:/opt/airflow/config
    - ./docker:/opt/airflow/docker
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL : base de métadonnées Airflow + Data Warehouse ──────────────
  postgres:
    image: postgres:15
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./sql/init_dwh.sql:/docker-entrypoint-initdb.d/init_dwh.sql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ── MinIO : Data Lake (stockage objet S3-compatible) ───────────────────────
  minio:
    image: minio/minio:latest
    container_name: nyc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9020:9000"   # API S3
      - "9021:9001"   # Console web → http://localhost:9021
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

  # ── MinIO Init : crée les buckets au premier démarrage ─────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: nyc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/nyc-datalake &&
      mc mb --ignore-existing local/nyc-datalake/raw/taxi &&
      mc mb --ignore-existing local/nyc-datalake/raw/weather &&
      mc mb --ignore-existing local/nyc-datalake/processed/taxi &&
      mc mb --ignore-existing local/nyc-datalake/processed/weather &&
      echo 'Buckets crees !'
      "
    restart: on-failure

  # ── Spark Master : coordinateur du cluster Spark ───────────────────────────
  spark-master:
    image: apache/spark:3.5.1-python3
    container_name: nyc_spark_master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8083:8080"   # Spark UI → http://localhost:8083
      - "7078:7077"   # Port cluster
    restart: always

  # ── Spark Worker : exécutant du cluster Spark ──────────────────────────────
  spark-worker:
    image: apache/spark:3.5.1-python3
    container_name: nyc_spark_worker
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - spark-master
    restart: always

  # ── Airflow Webserver : interface graphique + init DB ──────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_airflow_webserver
    entrypoint: ["/bin/bash", "/opt/airflow/docker/webserver_start.sh"]
    ports:
      - "8084:8080"   # Interface Airflow → http://localhost:8084
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: always

  # ── Airflow Scheduler : planificateur des DAGs ─────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_airflow_scheduler
    entrypoint: ["/bin/bash", "/opt/airflow/docker/scheduler_start.sh"]
    restart: always

volumes:
  postgres-db:    # Données PostgreSQL
  minio-data:     # Fichiers stockés dans MinIO
  airflow-logs:   # Logs des DAGs Airflow
